<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>หนึ่งตระกูล — Dynasty Sim</title>
    <meta name="description" content="เกมจำลองตระกูลขุนนางชั้นผู้น้อย ปลายอยุธยาถึงต้นรัตนโกสินทร์ เล่นต่อกันหลายรุ่นจนถึง พ.ศ. 2400" />
    <meta property="og:title" content="หนึ่งตระกูล" />
    <meta property="og:description" content="เกมจำลองตระกูลขุนนางชั้นผู้น้อย ปลายอยุธยาถึงต้นรัตนโกสินทร์ เล่นต่อกันหลายรุ่นจนถึง พ.ศ. 2400" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#8a3b12" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238a3b12'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23f6f1e7' font-family='serif'%3E%E0%B9%91%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" />
    <style>
      :root { --bg: #f6f1e7; --fg: #2b2118; --muted: #7a6a58; --line: #d9ccb6; --accent: #8a3b12; --panel: #fffaf0; --good: #3f7a3a; --sel: #f1e2c8; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1b1713; --fg: #eee3d2; --muted: #a8977f; --line: #3a3128; --accent: #e08a52; --panel: #241f1a; --good: #9ccc8a; --sel: #3a2c20; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Sarabun", system-ui, sans-serif; }
      main { max-width: 1220px; margin: 0 auto; padding: 12px 16px 16px; display: grid; gap: 12px 16px; grid-template-columns: minmax(0, 1fr) 360px; }
      .workspace { display: flex; flex-direction: column; min-height: 0; }
      aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
      @media (min-width: 801px) {
        html, body { height: 100%; overflow: hidden; }
        main { height: 100vh; grid-template-rows: auto minmax(0, 1fr); }
        .tab { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
        aside { overflow-y: auto; padding-right: 4px; }
      }
      @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
      /* แถบเวลาอยู่เหนือพื้นหลังของหน้าต่าง event — กดหยุดได้แม้ event เด้งถี่ */
      header { position: relative; z-index: 11; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      header h1 { font-size: 20px; margin: 0 auto 0 0; }
      button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button.rating { padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--accent); border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
      h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
      #log { flex: 1; min-height: 0; overflow-y: auto; font-size: 14px; }
      @media (max-width: 800px) { #log { height: 60vh; } }
      #log p { margin: 2px 0; }
      #log .year { color: var(--accent); font-weight: 600; margin-top: 8px; }
      #log .handover { border-left: 3px solid var(--accent); padding-left: 8px; }
      #log .handover-head { font-weight: 600; }
      #log .system { color: var(--muted); }
      [hidden] { display: none !important; }

      /* แท็บ */
      .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: -1px; flex-shrink: 0; position: relative; z-index: 1; }
      .tabs button { border-radius: 6px 6px 0 0; border-bottom-color: transparent; background: transparent; }
      .tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); font-weight: 600; }
      .tab { border-top-left-radius: 0; }
      .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-shrink: 0; }
      .chips label { cursor: pointer; white-space: nowrap; }

      /* ป้ายสถานะตัวละคร (ป่วย ท้อง แผลลึก ใจหนัก) */
      .statuses { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0; }
      .era-bar { display: flex; gap: 2px; margin: 6px 0; font-size: 11px; }
      .era-seg { padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; color: var(--muted); }
      .era-seg.past { background: var(--bg); }
      .era-seg.now { border-color: var(--accent); color: var(--fg); font-weight: 600; }
      .era-seg.future { border-style: dashed; }
      .pill { display: inline-block; font-size: 12px; line-height: 1.3; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
      .pill.bad { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .pill.warn { border-color: var(--muted); color: var(--fg); }
      .pill.good { border-color: var(--good); color: var(--good); font-weight: 600; }
      .pill.info { border-color: var(--line); color: var(--muted); }

      /* ผังตระกูล */
      #tree { flex: 1; min-height: 0; overflow: auto; font-size: 14px; }
      @media (max-width: 800px) { #tree { max-height: 65vh; } }
      #tree ul { list-style: none; padding-left: 18px; border-left: 1px dashed var(--line); margin-left: 6px; }
      #tree > ul { border-left: none; padding-left: 0; margin-left: 0; }
      #tree li { margin: 2px 0; }
      #tree details > summary { cursor: pointer; }
      #tree details:not([open]) > summary::after { content: " …"; color: var(--muted); }
      #tree .person { padding: 0 6px; border: 1px solid transparent; background: none; text-align: left; border-radius: 4px; }
      #tree .person.dead { color: var(--muted); }
      #tree .person.pruned { font-style: italic; }
      #tree .person.selected { background: var(--sel); border-color: var(--accent); }
      #tree .person.me { font-weight: 700; }
      .badge { font-size: 12px; color: var(--accent); margin-left: 4px; }

      /* เซฟ */
      .saveform { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; flex-shrink: 0; }
      .saveform input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 5px 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; }
      .slot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      .slot .info { flex: 1 1 220px; min-width: 0; font-size: 14px; }
      .slot .info b { display: block; }

      /* หน้าดูตัวละคร — เว้นด้านบนไว้ไม่ให้ซ้อนทับแถบคุมเวลา แบ่งหัวคงที่ + แท็บย่อย + เนื้อหาเลื่อนได้ */
      #sheet { position: fixed; inset: 0; z-index: 9; display: flex; align-items: flex-start; justify-content: center; padding: 64px 16px 16px; background: rgb(0 0 0 / .35); }
      #sheet[hidden] { display: none; }
      #inspect { width: min(680px, 100%); max-height: calc(100vh - 80px); display: flex; flex-direction: column; overflow: hidden; padding: 0; box-shadow: 0 12px 40px rgb(0 0 0 / .3); }
      #inspect .inspect-head { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--panel); }
      #inspect .top { display: flex; align-items: center; gap: 8px; }
      #inspect .top h2 { margin: 0 auto 0 0; color: var(--fg); font-size: 17px; }
      #inspect .inspect-tabs { display: flex; gap: 4px; padding: 6px 16px 0; border-bottom: 1px solid var(--line); background: var(--bg); flex-shrink: 0; }
      #inspect .inspect-tabs button { border-radius: 6px 6px 0 0; border-bottom-color: transparent; background: transparent; padding: 4px 12px; font-size: 14px; margin-bottom: -1px; }
      #inspect .inspect-tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); font-weight: 600; color: var(--accent); }
      #inspect .inspect-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; }
      #inspect .inspect-overview { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
      @media (max-width: 560px) { #inspect .inspect-overview { grid-template-columns: 1fr; } }
      #inspect figure.art { margin: 0; max-width: 240px; }
      #inspect dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 14px; margin: 0; }
      #inspect dt { color: var(--muted); }
      #inspect dd { margin: 0; }
      #inspect h3 { font-size: 14px; color: var(--muted); margin: 12px 0 4px; border-top: 1px solid var(--line); padding-top: 8px; }
      #inspect h3:first-child { margin-top: 0; border-top: none; padding-top: 0; }
      .who { padding: 0; border: none; background: none; font-weight: 600; text-decoration: underline dotted; }
      #backdrop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-start; justify-content: center; padding: 64px 16px 16px; background: rgb(0 0 0 / .45); }
      #backdrop[hidden] { display: none; }
      #event { width: min(560px, 100%); max-height: calc(100vh - 80px); overflow-y: auto; box-shadow: 0 12px 40px rgb(0 0 0 / .35); }
      #event h2 { font-size: 18px; color: var(--fg); }
      #event .notice-rating { display: flex; gap: 12px; align-items: center; margin: 4px 0 8px; }
      #event .notice-rating b { font-size: 28px; line-height: 1; padding: 8px 10px; border: 2px solid var(--accent); border-radius: 8px; color: var(--accent); }
      #event .notice-list { margin: 4px 0 8px; padding-left: 20px; }
      #event .notice-list li { margin: 2px 0; }
      #event .notice-fine { color: var(--muted); font-size: 14px; }
      /* หน้าเกี่ยวกับ / รุ่นใหม่ / สนับสนุน */
      #event .release-meta { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
      #event .release-group { margin: 10px 0 2px; font-size: 14px; font-weight: 600; color: var(--accent); }
      #event .release-list { margin: 2px 0 6px; padding-left: 20px; }
      #event .release-list li { margin: 3px 0; }
      #event .history details { border-top: 1px solid var(--line); padding: 6px 0; }
      #event .history summary { cursor: pointer; font-weight: 600; }
      #event .about-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0; font-size: 14px; }
      #event a { color: var(--accent); }
      #event .donate { text-align: center; }
      #event .donate img { display: block; margin: 8px auto; width: min(260px, 70vw); height: auto; border-radius: 8px; background: #fff; padding: 6px; }
      #event .row.split { justify-content: space-between; flex-wrap: wrap; }
      #log figure.art { max-width: 420px; margin: 6px 0; }
      figure.art { margin: 8px 0; }
      figure.art img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--line); }
      figure.art.portrait img { object-position: center 20%; }
      #dynasty figure.art, #player figure.art, #inspect figure.art { margin: 4px 0 8px; }
      #event form { display: grid; gap: 8px; margin-top: 8px; }
      #event form .row { display: flex; gap: 8px; justify-content: flex-end; }
      #event input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
      #event .error { color: var(--accent); font-size: 14px; }
      #event .opt { display: block; width: 100%; text-align: left; margin-top: 6px; }
      #event .opt.injected { border-style: dashed; }
      #event .triggered { color: var(--accent); font-size: 14px; }
      #event .opt .note { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
      #event .opt.strained .note { color: var(--accent); }
      .more { padding: 0 8px; margin-left: 6px; line-height: 1.4; }
      button.small { font-size: 13px; padding: 2px 10px; margin-top: 6px; }
      .care { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
      .care button { padding: 2px 10px; font-size: 14px; }
      .care button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .panelhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .panelhead h2 { margin: 0; }
      #event .match { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      #event .match figure.art { margin: 0; }
      #event .match figure.art img { aspect-ratio: 1; }
      @media (max-width: 480px) { #event .match { grid-template-columns: 64px 1fr; } #event .match > button { grid-column: 1 / -1; } }
      /* หน้าผลของตัวเลือก */
      #event .outcome { padding: 8px 10px; border-radius: 6px; border-left: 4px solid var(--good); background: var(--bg); }
      #event .outcome.bad { border-left-color: var(--accent); }
      #event .changes { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0; }
      #event .up { color: var(--good); }
      #event .down { color: var(--accent); }
      #event .rel { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; margin: 8px 0; }
      #event .opbar { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: var(--line); }
      #event .opbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
      #event .opbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
      #event .opbar i.pos { background: var(--good); }
      #event .opbar i.neg { background: var(--accent); }
      ul { margin: 0; padding-left: 18px; font-size: 14px; }
      #status { color: var(--muted); font-size: 14px; min-width: 7.5em; text-align: right; }
      .clock { display: inline-flex; align-items: center; gap: 10px; padding: 5px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
      .dates { display: flex; flex-direction: column; gap: 2px; line-height: 1.3; font-variant-numeric: tabular-nums; padding-right: 4px; }
      #date, #lunar { display: flex; align-items: baseline; white-space: nowrap; font-variant-numeric: tabular-nums; }
      #date { gap: 6px; font-weight: 600; font-size: 14px; }
      #lunar { gap: 10px; font-size: 12px; color: var(--muted); }
      /* จองความกว้างเท่าข้อความที่ยาวที่สุดของแต่ละช่องด้วย ::after — ไม่ซ้อนทับและไม่ดิ้น */
      .d-slot { display: inline-flex; flex-direction: column; white-space: nowrap; }
      .d-slot::after { content: attr(data-max); height: 0; visibility: hidden; overflow: hidden; user-select: none; pointer-events: none; }
      .d-slot.r { align-items: flex-end; }
      .d-slot.c { align-items: center; }
      .l-phase { display: inline-flex; align-items: baseline; gap: 3px; }
      .mobile-only { display: none; }
      /* มือถือและจอแคบ */
      @media (max-width: 800px) {
        main { padding: 8px 10px 24px; gap: 8px; }
        header { position: sticky; top: 0; background: var(--bg); padding: 6px 0; gap: 6px; border-bottom: 1px solid var(--line); }
        header h1 { font-size: 18px; }
        header button { padding: 6px 10px; font-size: 14px; }
        .clock { width: 100%; justify-content: space-between; padding: 6px 10px; gap: 6px; }
        .dates { flex: 1; min-width: 0; }
        #lunar { gap: 6px; }
        #lunar .l-cs { display: none; }
        .mobile-only { display: inline-block; }
        main:not([data-tab="player"]) > aside { display: none; }
        main[data-tab="player"] > .workspace > .tab { display: none !important; }
        .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 2px; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button { flex: 0 0 auto; padding: 8px 12px; font-size: 14px; }
        #filters { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
        #filters::-webkit-scrollbar { display: none; }
        section { padding: 10px 12px; }
        #log { height: calc(100dvh - 210px); min-height: 280px; }
        #known, #tree { max-height: none; }
        #backdrop, #sheet { padding: 8px; align-items: flex-end; }
        #event, #inspect { width: 100%; max-height: calc(100dvh - 16px); border-radius: 12px; }
        #event .opt { padding: 10px 12px; margin-top: 8px; }
      }
      @media (max-width: 420px) {
        .clock { flex-wrap: wrap; }
        .dates { width: 100%; }
        #status { min-width: 0; font-size: 12px; }
      }
      #play { min-width: 5.5em; text-align: center; }
      #play.playing { border-color: var(--accent); color: var(--accent); }
      #speed { letter-spacing: 2px; color: var(--accent); font-size: 12px; }
      .muted { color: var(--muted); font-size: 13px; }
      .lifestyle { font-size: 14px; margin-top: 4px; }
      .intent { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 6px; font-size: 14px; }
      .intent progress { width: 100%; height: 8px; accent-color: var(--accent); }
      .intent .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .intent button, #known .acts button { padding: 2px 10px; font-size: 13px; }
      #known { flex: 1; min-height: 0; }
      @media (max-width: 800px) { #known { max-height: 65vh; overflow-y: auto; } }
      #known details { margin-top: 8px; }
      #known details > summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
      #known .person { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
      #known .person.focus { border-left: 3px solid var(--accent); padding-left: 8px; }
      #known .tie { color: var(--accent); }
      #known .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      #event .approach strong { display: block; }
      #event .factors { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
      #event .factors .up { color: var(--good); }
      #event .factors .down { color: var(--accent); }
      #event .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
      #event dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; margin: 8px 0; }
      #event dt { color: var(--muted); }
      #event dd { margin: 0; }
      #event h3 { font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
      .track-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
      .track-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--card); }
      .track-card.active { border-color: var(--accent); }
      .track-card progress { width: 100%; height: 8px; accent-color: var(--accent); margin: 6px 0; }
      .perk-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
      .perk-item { padding: 6px 0; border-top: 1px solid var(--line); color: var(--muted); }
      .perk-item.unlocked { color: var(--fg); }
      .perk-item.unlocked strong { color: var(--good); }
      .perk-item.next strong { color: var(--accent); }
      .house-box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--card); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>หนึ่งตระกูล</h1>
        <button id="notice" class="rating" title="เรตและข้อควรทราบก่อนเล่น">15+</button>
        <span id="status">กำลังโหลด…</span>
        <button id="about" title="เกี่ยวกับเกม เวอร์ชัน และสนับสนุนผู้พัฒนา">เกี่ยวกับ</button>
        <button id="new">เริ่มใหม่</button>
        <span class="clock">
          <span class="dates"><span id="date"></span><span id="lunar"></span></span>
          <button id="play" disabled title="เดิน/หยุดเวลา (Space)">▶ เดิน</button>
          <button id="slower" disabled title="ช้าลง (−)" aria-label="ช้าลง">−</button>
          <span id="speed" aria-live="polite"></span>
          <button id="faster" disabled title="เร็วขึ้น (+)" aria-label="เร็วขึ้น">+</button>
        </span>
      </header>
      <div class="workspace">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="log">บันทึก</button>
          <button role="tab" data-tab="player" class="mobile-only" id="tabBtnPlayer">ตัวละคร</button>
          <button role="tab" data-tab="known" id="tabBtnKnown">คนที่รู้จัก</button>
          <button role="tab" data-tab="house" id="tabBtnHouse">เรือน</button>
          <button role="tab" data-tab="skills" id="tabBtnSkills">วิชา</button>
          <button role="tab" data-tab="tree">ผังตระกูล</button>
          <button role="tab" data-tab="saves">เซฟ/โหลด</button>
        </nav>
        <section class="tab" id="tab-log">
          <div class="chips" id="filters"></div>
          <div id="log"></div>
        </section>
        <section class="tab" id="tab-known" hidden>
          <div id="known"><h2>คนที่รู้จัก</h2></div>
        </section>
        <section class="tab" id="tab-house" hidden>
          <div id="house"><h2>เรือนของเรา</h2></div>
        </section>
        <section class="tab" id="tab-skills" hidden>
          <div id="skills"><h2>วิชาและความชำนาญ</h2></div>
        </section>
        <section class="tab" id="tab-tree" hidden>
          <div class="chips"><span id="treeInfo"></span><button id="findMe">ไปที่ตัวละครผู้เล่น</button></div>
          <div id="tree"></div>
        </section>
        <section class="tab" id="tab-saves" hidden>
          <form class="saveform" id="saveForm">
            <input id="slotName" maxlength="40" required placeholder="ชื่อช่องเซฟ" value="เซฟ 1" aria-label="ชื่อช่องเซฟ" />
            <button id="saveBtn" type="submit" disabled>บันทึกลงช่องนี้</button>
          </form>
          <div id="slots"></div>
        </section>
      </div>
      <div id="sheet" hidden><section id="inspect"></section></div>
      <aside>
        <section id="player"><h2>ตัวละคร</h2></section>
        <section id="dynasty"><h2>ตระกูล</h2></section>
      </aside>
    </main>
    <div id="backdrop" hidden><section id="event" role="dialog" aria-modal="true"></section></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
