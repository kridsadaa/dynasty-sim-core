<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>หนึ่งตระกูล — Dynasty Sim</title>
    <style>
      :root { --bg: #f6f1e7; --fg: #2b2118; --muted: #7a6a58; --line: #d9ccb6; --accent: #8a3b12; --panel: #fffaf0; --good: #3f7a3a; --sel: #f1e2c8; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1b1713; --fg: #eee3d2; --muted: #a8977f; --line: #3a3128; --accent: #e08a52; --panel: #241f1a; --good: #9ccc8a; --sel: #3a2c20; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Sarabun", system-ui, sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 340px; }
      @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
      header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      header h1 { font-size: 20px; margin: 0 auto 0 0; }
      button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
      h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
      #log { height: 60vh; overflow-y: auto; font-size: 14px; }
      #log p { margin: 2px 0; }
      #log .year { color: var(--accent); font-weight: 600; margin-top: 8px; }
      #log .handover { border-left: 3px solid var(--accent); padding-left: 8px; }
      #log .handover-head { font-weight: 600; }
      #log .system { color: var(--muted); }
      [hidden] { display: none !important; }

      /* แท็บ */
      .tabs { display: flex; gap: 4px; margin-bottom: -1px; }
      .tabs button { border-radius: 6px 6px 0 0; border-bottom-color: transparent; background: transparent; }
      .tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); font-weight: 600; }
      .tab { border-top-left-radius: 0; }
      .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
      .chips label { cursor: pointer; white-space: nowrap; }

      /* ผังตระกูล */
      #tree { max-height: 65vh; overflow: auto; font-size: 14px; }
      #tree ul { list-style: none; padding-left: 18px; border-left: 1px dashed var(--line); margin-left: 6px; }
      #tree > ul { border-left: none; padding-left: 0; margin-left: 0; }
      #tree li { margin: 2px 0; }
      #tree details > summary { cursor: pointer; }
      #tree details:not([open]) > summary::after { content: " …"; color: var(--muted); }
      #tree .person { padding: 0 6px; border: 1px solid transparent; background: none; text-align: left; border-radius: 4px; }
      #tree .person.dead { color: var(--muted); }
      #tree .person.pruned { font-style: italic; }
      #tree .person.selected { background: var(--sel); border-color: var(--accent); }
      #tree .person.me { font-weight: 700; }
      .badge { font-size: 12px; color: var(--accent); margin-left: 4px; }

      /* เซฟ */
      .saveform { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .saveform input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 5px 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; }
      .slot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      .slot .info { flex: 1 1 220px; min-width: 0; font-size: 14px; }
      .slot .info b { display: block; }

      /* หน้าดูตัวละคร */
      #inspect { margin-bottom: 16px; }
      #inspect .top { display: flex; align-items: baseline; gap: 8px; }
      #inspect .top h2 { margin: 0 auto 0 0; color: var(--fg); font-size: 17px; }
      #inspect dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; margin: 8px 0; }
      #inspect dt { color: var(--muted); }
      #inspect dd { margin: 0; }
      #inspect h3 { font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
      .who { padding: 0; border: none; background: none; font-weight: 600; text-decoration: underline dotted; }
      #backdrop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgb(0 0 0 / .45); }
      #backdrop[hidden] { display: none; }
      #event { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 12px 40px rgb(0 0 0 / .35); }
      #event h2 { font-size: 18px; color: var(--fg); }
      #event form { display: grid; gap: 8px; margin-top: 8px; }
      #event form .row { display: flex; gap: 8px; justify-content: flex-end; }
      #event input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
      #event .error { color: var(--accent); font-size: 14px; }
      #event .opt { display: block; width: 100%; text-align: left; margin-top: 6px; }
      #event .opt.injected { border-style: dashed; }
      #event .triggered { color: var(--accent); font-size: 14px; }
      #event .opt .note { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
      #event .opt.strained .note { color: var(--accent); }
      ul { margin: 0; padding-left: 18px; font-size: 14px; }
      #status { color: var(--muted); font-size: 14px; }
      .clock { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
      .dates { display: inline-flex; flex-direction: column; line-height: 1.2; min-width: 13em; }
      /* จอแคบ: วันที่ยาวกว่าจอ → ให้นาฬิกาตัดบรรทัด ไม่งั้นหน้ากว้างเกินจอ และหน้าต่าง event โดนตัด */
      @media (max-width: 480px) { .clock { flex-wrap: wrap; max-width: 100%; } .dates { min-width: 0; } }
      #date { font-variant-numeric: tabular-nums; }
      #lunar { font-size: 0.75em; color: var(--muted); }
      #play { min-width: 5.5em; }
      #play.playing { border-color: var(--accent); color: var(--accent); }
      #speed { letter-spacing: 2px; color: var(--accent); font-size: 12px; }
      .muted { color: var(--muted); font-size: 13px; }
      .lifestyle { font-size: 14px; margin-top: 4px; }
      .intent { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 6px; font-size: 14px; }
      .intent progress { width: 100%; height: 8px; accent-color: var(--accent); }
      .intent .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .intent button, #known .acts button { padding: 2px 10px; font-size: 13px; }
      #known details > summary { cursor: pointer; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
      #known .person { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
      #known .person.focus { border-left: 3px solid var(--accent); padding-left: 8px; }
      #known .tie { color: var(--accent); }
      #known .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      #event .approach strong { display: block; }
      #event .factors { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
      #event .factors .up { color: var(--good); }
      #event .factors .down { color: var(--accent); }
      #event .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
      #event dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; margin: 8px 0; }
      #event dt { color: var(--muted); }
      #event dd { margin: 0; }
      #event h3 { font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>หนึ่งตระกูล</h1>
        <span id="status">กำลังโหลด…</span>
        <button id="new">เริ่มใหม่</button>
        <span class="clock">
          <span class="dates"><span id="date"></span><span id="lunar"></span></span>
          <button id="play" disabled title="เดิน/หยุดเวลา (Space)">▶ เดิน</button>
          <button id="slower" disabled title="ช้าลง (−)" aria-label="ช้าลง">−</button>
          <span id="speed" aria-live="polite"></span>
          <button id="faster" disabled title="เร็วขึ้น (+)" aria-label="เร็วขึ้น">+</button>
        </span>
      </header>
      <div>
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="log">บันทึก</button>
          <button role="tab" data-tab="tree">ผังตระกูล</button>
          <button role="tab" data-tab="saves">เซฟ/โหลด</button>
        </nav>
        <section class="tab" id="tab-log">
          <div class="chips" id="filters"></div>
          <div id="log"></div>
        </section>
        <section class="tab" id="tab-tree" hidden>
          <div class="chips"><span id="treeInfo"></span><button id="findMe">ไปที่ตัวละครผู้เล่น</button></div>
          <div id="tree"></div>
        </section>
        <section class="tab" id="tab-saves" hidden>
          <form class="saveform" id="saveForm">
            <input id="slotName" maxlength="40" required placeholder="ชื่อช่องเซฟ" value="เซฟ 1" aria-label="ชื่อช่องเซฟ" />
            <button id="saveBtn" type="submit" disabled>บันทึกลงช่องนี้</button>
          </form>
          <div id="slots"></div>
        </section>
      </div>
      <aside>
        <section id="inspect" hidden></section>
        <section id="player"><h2>ตัวละคร</h2></section>
        <section id="known" style="margin-top:16px"><h2>คนที่รู้จัก</h2></section>
        <section id="dynasty" style="margin-top:16px"><h2>ตระกูล</h2></section>
      </aside>
    </main>
    <div id="backdrop" hidden><section id="event" role="dialog" aria-modal="true"></section></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
